<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Keeply HQ</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0E0B14;color:#EDE9F7;font:15px -apple-system,Segoe UI,Roboto,sans-serif;-webkit-app-region:drag}
.box{text-align:center;max-width:360px}h1{font-size:20px;margin:0 0 8px}p{color:#A79FBF;margin:0 0 20px;line-height:1.5}
button{-webkit-app-region:no-drag;background:#6B4AF2;color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer}</style></head>
<body><div class="box"><h1>Pas de connexion</h1><p>Keeply HQ a besoin d'Internet. Vérifiez votre connexion puis réessayez.</p>
<button onclick="location.href=new URLSearchParams(location.search).get('retry')||'https://keeply-hq.vercel.app'">Réessayer</button></div></body></html>
